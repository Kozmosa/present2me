[workspace]
name = "present2me"
version = "0.3.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
nodejs = ">=20,<23"
python = ">=3.11,<3.14"
uv = ">=0.6"
d2 = ">=0.6"

[tasks]
setup = "npm install --prefix .pixi-tools --no-fund --no-audit --package-lock=false @mermaid-js/mermaid-cli puppeteer && npm exec --prefix .pixi-tools -- puppeteer browsers install chrome-headless-shell"
mmdc = "npm exec --prefix .pixi-tools --package=@mermaid-js/mermaid-cli -- mmdc"

[pypi-dependencies]
# Python tooling can be added here without touching the system interpreter.
