[workspace]
name = "present2me"
version = "0.3.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
nodejs = ">=20,<23"
python = ">=3.11,<3.14"
uv = ">=0.6"
d2 = ">=0.6"

[tasks]
setup = "npm install --prefix .pixi-tools --no-fund --no-audit @mermaid-js/mermaid-cli"
mmdc = "npx --prefix .pixi-tools mmdc"

[pypi-dependencies]
# Python tooling can be added here without touching the system interpreter.
